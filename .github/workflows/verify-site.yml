name: Verify portfolio site
on:
  workflow_dispatch:
  push:
    branches: ["codex/papermark-community"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci_only
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:ci_only@localhost:5432/postgres
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ephemeral-github-runner-only
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run vercel-build
      - name: Test the public site and protected workspace
        run: |
          npm start > "$RUNNER_TEMP/folio.log" 2>&1 &
          curl -fsS --retry 15 --retry-connrefused http://localhost:3000/ | grep -q 'Documents worth sharing'
          curl -fsSL http://localhost:3000/documents | grep -qi 'sign in'
